name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm test -- --coverage

      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Vitest
          path: reports/junit.xml
          reporter: jest-junit

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - uses: ./.github/actions/build

      - name: Commit updated dist to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/
          git diff --staged --quiet || git commit -m "build: update dist" && git push

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  integration:
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Run action
        id: resolve
        uses: ./
        with:
          project_file: tests/fixtures/TestApp/TestApp.xcodeproj

      - name: Verify outputs
        env:
          DEPENDENCIES_CHANGED: ${{ steps.resolve.outputs.dependenciesChanged }}
          SUMMARY: ${{ steps.resolve.outputs.summary }}
        run: |
          echo "dependenciesChanged=${DEPENDENCIES_CHANGED}"
          echo "summary=${SUMMARY}"
          if [ "${DEPENDENCIES_CHANGED}" != "true" ]; then
            echo "::error::Expected dependenciesChanged to be 'true', got '${DEPENDENCIES_CHANGED}'"
            exit 1
          fi
          if [ -z "${SUMMARY}" ]; then
            echo "::error::Expected summary to be non-empty"
            exit 1
          fi

      - name: Verify repo is clean except Package.resolved
        run: |
          CHANGED=$(git diff --name-only)
          echo "Changed files: ${CHANGED}"
          UNEXPECTED=$(echo "${CHANGED}" | grep -v -e 'Package.resolved' -e '^dist/' || true)
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::Unexpected changed files after action: ${UNEXPECTED}"
            exit 1
          fi
          UNTRACKED=$(git ls-files --others --exclude-standard)
          echo "Untracked files: ${UNTRACKED}"
          if [ -n "${UNTRACKED}" ]; then
            echo "::error::Unexpected untracked files after action: ${UNTRACKED}"
            exit 1
          fi

  integration-workspace:
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Run action with workspace
        id: resolve
        uses: ./
        with:
          workspace_file: tests/fixtures/TestWorkspce/TestWorkspace.xcworkspace
          scheme: TestWorkspce

      - name: Verify outputs
        env:
          DEPENDENCIES_CHANGED: ${{ steps.resolve.outputs.dependenciesChanged }}
          SUMMARY: ${{ steps.resolve.outputs.summary }}
        run: |
          echo "dependenciesChanged=${DEPENDENCIES_CHANGED}"
          echo "summary=${SUMMARY}"
          if [ "${DEPENDENCIES_CHANGED}" != "true" ]; then
            echo "::error::Expected dependenciesChanged to be 'true', got '${DEPENDENCIES_CHANGED}'"
            exit 1
          fi
          if [ -z "${SUMMARY}" ]; then
            echo "::error::Expected summary to be non-empty"
            exit 1
          fi

      - name: Verify repo is clean except Package.resolved
        run: |
          CHANGED=$(git diff --name-only)
          echo "Changed files: ${CHANGED}"
          UNEXPECTED=$(echo "${CHANGED}" | grep -v -e 'Package.resolved' -e '^dist/' || true)
          if [ -n "${UNEXPECTED}" ]; then
            echo "::error::Unexpected changed files after action: ${UNEXPECTED}"
            exit 1
          fi
          UNTRACKED=$(git ls-files --others --exclude-standard)
          echo "Untracked files: ${UNTRACKED}"
          if [ -n "${UNTRACKED}" ]; then
            echo "::error::Unexpected untracked files after action: ${UNTRACKED}"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check
