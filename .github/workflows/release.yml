name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.2.3)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: '${{ inputs.version }}'. Expected A.B.C (e.g. 1.2.3)"
            exit 1
          fi

      # The release PR must be opened with a token other than the default
      # GITHUB_TOKEN — GitHub does not trigger pull_request/push workflows for
      # events created by GITHUB_TOKEN, so test.yml would never run on the PR.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Bump version in package.json
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Push release branch and open pull request
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b release/v${{ inputs.version }}
          git add dist/ package.json
          git commit -m "release: v${{ inputs.version }}"
          git push origin release/v${{ inputs.version }}
          gh pr create \
            --title "release: v${{ inputs.version }}" \
            --body "Automated release PR for v${{ inputs.version }}. Merge to publish." \
            --base main \
            --head release/v${{ inputs.version }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
