name: Xcode Packages Update
description: Resolves Xcode Swift Package Manager dependencies and reports what changed.

inputs:
  project_file:
    description: Path to the .xcodeproj file. Mutually exclusive with workspace_file.
    required: false
  workspace_file:
    description: Path to the .xcworkspace file. Mutually exclusive with project_file. Requires scheme.
    required: false
  scheme:
    description: Xcode scheme to use. Required when workspace_file is provided. Must be a shared scheme. Ignored when using project_file.
    required: false
  temporary_packages_dir_path:
    description: Path to a temporary directory for cloned SPM sources
    required: false
    default: .spm-tmp
  html_report_path:
    description: >
      Optional path where the HTML dependency report will be written.
      The report lists every resolved package with its repository URL,
      installed version, latest resolved version, dependency type, and change status.
      Parent directories are created automatically.
    required: false
  sbom_path:
    description: >
      Optional path where the CycloneDX 1.6 JSON SBOM will be written.
      Development packages are tagged with scope "excluded"; app packages with "required".
      Parent directories are created automatically.
    required: false
  development_packages:
    description: >
      Newline- or comma-separated list of package identities that are development-only
      (e.g. test frameworks, linting plugins). These are labelled "Development" in the HTML
      report and given scope "excluded" in the SBOM.
    required: false
    default: ''

outputs:
  dependenciesChanged:
    description: 'true if any package was added, removed or updated'
  summary:
    description: 'Human-readable list of added, removed and updated packages'
  html_report_path:
    description: 'Path to the generated HTML dependency report (only set when html_report_path input is provided)'
  sbom_path:
    description: 'Path to the generated CycloneDX SBOM (only set when sbom_path input is provided)'

branding:
  icon: package
  color: orange

runs:
  using: 'node24'
  main: 'dist/main/index.cjs'
  post: 'dist/post/index.cjs'
  post-if: 'always()'
